<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一笔一划签名设计 · 父页面独立版</title>
    <style>
        /* ====== 全局重置 ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #f5f0ff 0%, #fde8e8 100%);
            font-family: 'Microsoft YaHei','PingFang SC',Arial,sans-serif;
            min-height: 100vh;
            padding: 28px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1200px; width: 100%;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(14px);
            border-radius: 36px;
            box-shadow: 0 24px 80px rgba(254,120,120,0.14), 0 8px 28px rgba(0,0,0,0.04);
            padding: 28px 30px 24px;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap:12px; margin-bottom:16px;
            padding-bottom:14px; border-bottom:2px solid rgba(254,120,120,0.12);
        }
        .header h1 {
            font-size: 1.7rem; font-weight:700; color:#2d2a3a;
            display:flex; align-items:center; gap:12px;
        }
        .header h1 .icon {
            display:inline-flex; align-items:center; justify-content:center;
            width:40px; height:40px;
            background: linear-gradient(135deg,#fe7878,#ff9a9a);
            border-radius:12px; color:#fff; font-size:1.3rem;
            box-shadow:0 4px 14px rgba(254,120,120,0.3);
        }
        .header .badge {
            background:#fe7878; color:#fff; font-size:0.75rem;
            padding:4px 16px; border-radius:30px; font-weight:600;
        }
        .note {
            background:#fff6f5; border-left:4px solid #fe7878;
            padding:12px 18px; border-radius:12px;
            font-size:0.85rem; color:#555; margin-bottom:18px; line-height:1.6;
        }
        .note strong { color:#fe7878; }

        .quick-panel {
            background: linear-gradient(135deg,#fff6f5,#fff0ee);
            border-radius:20px; padding:18px 24px 22px; margin-bottom:18px;
            border-left:5px solid #fe7878;
            display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px;
        }
        .quick-panel .field-group {
            display:flex; flex-direction:column; gap:4px;
            flex:1 1 160px; min-width:130px;
        }
        .quick-panel .field-group label {
            font-size:0.8rem; font-weight:600; color:#5a4d62;
            display:flex; align-items:center; gap:6px;
        }
        .quick-panel .field-group input,
        .quick-panel .field-group select {
            padding:8px 14px; border:2px solid #f0e6f0; border-radius:12px;
            font-size:1rem; background:#fff; transition:0.2s; outline:none;
            font-family:inherit;
        }
        .quick-panel .field-group input:focus,
        .quick-panel .field-group select:focus {
            border-color:#fe7878; box-shadow:0 0 0 3px rgba(254,120,120,0.12);
        }
        .btn-group {
            display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px;
        }
        .btn-primary {
            background: linear-gradient(135deg,#fe7878,#f56363);
            border:none; color:#fff; padding:10px 32px; border-radius:30px;
            font-size:1.05rem; font-weight:700; cursor:pointer;
            transition:0.25s;
            box-shadow:0 4px 16px rgba(254,120,120,0.3);
            letter-spacing:0.5px; min-height:44px;
            display:inline-flex; align-items:center; gap:8px;
        }
        .btn-primary:hover {
            transform:translateY(-2px) scale(1.02);
            box-shadow:0 8px 28px rgba(254,120,120,0.35);
        }
        .btn-primary:active { transform:translateY(0) scale(0.97); }
        .btn-secondary {
            background:#fff; border:2px solid #fe7878; color:#fe7878;
            padding:8px 20px; border-radius:30px; font-size:0.85rem;
            font-weight:600; cursor:pointer; transition:0.2s; min-height:44px;
            display:inline-flex; align-items:center; gap:6px;
        }
        .btn-secondary:hover { background:#fe7878; color:#fff; }
        .btn-secondary.outline-gray {
            border-color:#aaa; color:#999;
        }
        .btn-secondary.outline-gray:hover { background:#aaa; color:#fff; border-color:#aaa; }

        .main-grid {
            display:flex; flex-wrap:wrap; gap:20px;
        }
        .left-col { flex:1 1 360px; min-width:280px; }
        .right-col { flex:2 1 500px; min-width:300px; }

        .result-card {
            background:#fff; border-radius:18px; padding:18px 20px 16px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02), 0 4px 16px rgba(254,120,120,0.06);
            border:1px solid #f5edf5; min-height:180px;
            display:flex; flex-direction:column;
        }
        .result-card .result-title {
            font-size:0.85rem; font-weight:600; color:#5a4d62;
            margin-bottom:12px; display:flex; align-items:center; gap:8px;
        }
        .result-card .result-title .dot {
            width:8px; height:8px; border-radius:50%; background:#58cb64;
            display:inline-block;
        }
        .result-card .result-content {
            flex:1; display:flex; align-items:center; justify-content:center;
            background:#faf8fa; border-radius:12px; padding:16px;
            min-height:120px; border:1px dashed #e8dee8; transition:0.3s;
            flex-wrap: wrap; gap:12px;
        }
        .result-card .result-content img {
            max-width:100%; max-height:260px; border-radius:10px;
            box-shadow:0 4px 20px rgba(0,0,0,0.06);
        }
        .result-card .result-content .placeholder {
            color:#b3a5bb; font-size:0.95rem;
            display:flex; flex-direction:column; align-items:center; gap:8px;
        }
        .result-card .result-content .placeholder .icon-big { font-size:2.4rem; opacity:0.5; }

        .table-wrapper {
            background:#fff; border-radius:18px; padding:12px 16px 16px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02), 0 4px 16px rgba(254,120,120,0.06);
            border:1px solid #f5edf5;
        }
        .table-wrapper .table-title {
            font-size:0.85rem; font-weight:600; color:#5a4d62;
            margin-bottom:10px; display:flex; align-items:center; gap:8px;
        }
        table {
            width:100%; border-collapse:collapse; border-radius:12px;
            overflow:hidden; font-size:0.9rem;
        }
        th {
            background:#fe7878; color:#fff; padding:10px 8px;
            font-weight:600; text-align:center;
        }
        td {
            padding:8px 6px; border-bottom:1px solid #f0e8e8;
            color:#333; text-align:center; transition:background 0.3s;
        }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#fef6f4; }
        .table-footer {
            margin-top:14px; text-align:center; font-size:0.8rem; color:#999;
        }

        /* iframe 仅作装饰 */
        .iframe-decor {
            margin-top:20px;
            border-radius:18px; overflow:hidden; border:1px solid #f0e6f0;
            background:#fafafa; height:600px; position:relative;
        }
        .iframe-decor iframe {
            width:100%; height:100%; border:none;
        }
        .iframe-decor .mask-note {
            position:absolute; bottom:12px; right:12px;
            background:rgba(255,255,255,0.8); padding:4px 12px; border-radius:20px;
            font-size:0.7rem; color:#fe7878;
        }

        .toast {
            position:fixed; top:30px; left:50%; transform:translateX(-50%);
            background:#1a2b4a; color:#fff; padding:12px 28px; border-radius:12px;
            font-size:15px; font-weight:500;
            box-shadow:0 8px 30px rgba(0,0,0,0.25); z-index:9999;
            opacity:0; transition:opacity 0.4s ease, transform 0.4s ease;
            pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        @media (max-width:700px) {
            .container { padding:16px 12px; }
            .quick-panel { flex-direction:column; align-items:stretch; }
            .quick-panel .field-group { min-width:unset; }
            .btn-group { justify-content:center; }
            .header h1 { font-size:1.3rem; }
            .iframe-decor { height:400px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><span class="icon">✍️</span> 签名设计 · 父页面独立版</h1>
        <span class="badge">iframe 仅供视觉参考</span>
    </div>

    <div class="note">
        <strong>🔒 跨域说明：</strong> 由于浏览器安全策略，父页面无法直接操作 iframe 中的内容。因此本页面<strong>不依赖 iframe</strong>，而是<strong>直接调用原站 API</strong> 生成签名。<br>
        若您没有后端代理，将使用 Canvas 模拟预览（美观可用）。<br>
        <strong>表格内容完全由本页控制</strong>，与 iframe 无关。
    </div>

    <div class="quick-panel">
        <div class="field-group">
            <label>✏️ 输入文字</label>
            <input type="text" id="inputText" placeholder="例如：恭喜大发财" value="恭喜大发财" />
        </div>
        <div class="field-group">
            <label>动画速度</label>
            <select id="speedSelect">
                <option value="5">0.05秒/图</option>
                <option value="10">0.1秒/图</option>
                <option value="20">0.2秒/图</option>
                <option value="30">0.3秒/图</option>
                <option value="40">0.4秒/图</option>
                <option value="50">0.5秒/图</option>
                <option value="80">0.8秒/图</option>
                <option value="100" selected>1.0秒/图</option>
                <option value="200">2.0秒/图</option>
                <option value="500">5.0秒/图</option>
                <option value="800">8.0秒/图</option>
            </select>
        </div>
        <div class="field-group">
            <label>背景颜色</label>
            <input type="text" id="bgColor" class="color-preview" value="#FFFFFF" />
        </div>
        <div class="field-group">
            <label>手写颜色</label>
            <input type="text" id="penColor" class="color-preview" value="#000000" />
        </div>
        <div class="btn-group">
            <button class="btn-primary" id="generateBtn">🎨 生成签名</button>
            <button class="btn-secondary" id="modifyTableBtn">📋 一键修改表格内容</button>
            <button class="btn-secondary outline-gray" id="resetTableBtn">↩️ 恢复默认</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="left-col">
            <div class="result-card">
                <div class="result-title"><span class="dot"></span> 签名预览</div>
                <div class="result-content" id="signaturePreview">
                    <div class="placeholder">
                        <span class="icon-big">🖌️</span>
                        <span>点击「生成签名」查看结果</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="table-wrapper">
                <div class="table-title">📊 签名设计数据表（一键修改）</div>
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>姓名</th>
                            <th>签名风格</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="table-footer">
                    💡 点击「一键修改表格内容」可更新数据
                </div>
            </div>
        </div>
    </div>

    <!-- iframe 装饰区 -->
    <div class="iframe-decor">
        <iframe src="http://jiqie.zhenbi.com/a/44.htm" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>
        <div class="mask-note">iframe 仅作展示，不参与操作</div>
    </div>
</div>

<div id="toast" class="toast">操作成功</div>

<script>
    (function() {
        'use strict';

        // ========== DOM 引用 ==========
        const inputText = document.getElementById('inputText');
        const speedSelect = document.getElementById('speedSelect');
        const bgColor = document.getElementById('bgColor');
        const penColor = document.getElementById('penColor');
        const generateBtn = document.getElementById('generateBtn');
        const modifyTableBtn = document.getElementById('modifyTableBtn');
        const resetTableBtn = document.getElementById('resetTableBtn');
        const tableBody = document.getElementById('tableBody');
        const signaturePreview = document.getElementById('signaturePreview');
        const toast = document.getElementById('toast');

        // ========== 默认表格数据 ==========
        const defaultRows = [
            { name: '张伟', style: '行楷', status: '✅ 已完成' },
            { name: '李娜', style: '草书', status: '⏳ 设计中' },
            { name: '王强', style: '隶书', status: '✅ 已完成' },
            { name: '赵敏', style: '艺术签', status: '⏳ 设计中' },
        ];

        // ========== 渲染表格 ==========
        function renderTable(rows) {
            let html = '';
            rows.forEach((r, index) => {
                html += `<tr>
                    <td>${index + 1}</td>
                    <td>${r.name}</td>
                    <td>${r.style}</td>
                    <td>${r.status}</td>
                </tr>`;
            });
            tableBody.innerHTML = html;
        }
        renderTable(defaultRows);

        // ========== Toast 提示 ==========
        let toastTimer = null;
        function showToast(text, duration) {
            duration = duration || 1800;
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ========== 一键修改表格内容 ==========
        function modifyTable() {
            const text = inputText.value.trim() || '默认文字';
            const newRows = [
                { name: text, style: '🔥 艺术签名', status: '✅ 已生成' },
                { name: '李娜',   style: '草书',     status: '⏳ 设计中' },
                { name: '王强',   style: '隶书',     status: '✅ 已完成' },
                { name: '赵敏',   style: '✍️ ' + text + ' 风格', status: '✅ 已生成' }
            ];
            renderTable(newRows);
            showToast('✅ 表格内容已更新为：“' + text + '”', 2000);
        }

        // ========== 恢复默认表格 ==========
        function resetTable() {
            renderTable(defaultRows);
            inputText.value = '恭喜大发财';
            showToast('↩️ 已恢复默认表格数据', 1600);
        }

        // ========== 生成签名（API请求 + Canvas回退） ==========
        async function generateSignature() {
            const text = inputText.value.trim() || '默认文字';
            const speed = speedSelect.value;
            const bg = bgColor.value.trim() || '#FFFFFF';
            const pen = penColor.value.trim() || '#000000';

            // 显示加载状态
            signaturePreview.innerHTML = `
                <div class="placeholder">
                    <span class="icon-big">⏳</span>
                    <span>正在生成签名…</span>
                </div>
            `;

            // 1️⃣ 尝试通过 API 获取真实签名（需要后端代理）
            // 如果你有同域下的 proxy.php（见上方说明），将下面 URL 改为 'proxy.php'
            const proxyUrl = 'proxy.php'; // 直接请求（跨域会失败）
            const formData = new URLSearchParams();
            formData.append('id', text);
            formData.append('zhenbi', '20191123');
            formData.append('id1', speed);
            formData.append('id3', bg);
            formData.append('id4', pen);

            let success = false;
            try {
                // 使用 mode: 'no-cors' 可以发出请求，但无法读取响应
                // 在真实场景中建议使用后端代理
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString(),
                    mode: 'no-cors'  // 防止跨域错误，但 response 为空
                });
                // 无法获取 response 内容，故此处无法处理
                // 若使用后端代理，可取消 no-cors，并解析 JSON
                // 这里降级到 Canvas 模拟
            } catch (err) {
                // 跨域错误，降级
            }

            // 2️⃣ 无论 API 成功与否，都使用 Canvas 生成预览（保证用户可见）
            const canvas = document.createElement('canvas');
            canvas.width = 360;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = pen;
            ctx.font = 'bold 32px "Microsoft YaHei","楷体","KaiTi",serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width/2, canvas.height/2);

            signaturePreview.innerHTML = '';
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            img.alt = '签名预览（Canvas 模拟）';
            signaturePreview.appendChild(img);
            showToast('🎨 签名生成成功（Canvas 模拟预览）', 1800);

            // 如果你有后端代理，可以在此处添加真正的 API 调用逻辑
            // 例如：const res = await fetch('/proxy.php', { method:'POST', body:formData });
            // const json = await res.json();
            // 然后解析 json 中的图片 URL 并显示
        }

        // ========== 绑定事件 ==========
        generateBtn.addEventListener('click', generateSignature);
        modifyTableBtn.addEventListener('click', modifyTable);
        resetTableBtn.addEventListener('click', resetTable);
        inputText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateSignature();
        });

        console.log('✅ 父页面独立版已启动。');
    })();
</script>

</body>
</html>
